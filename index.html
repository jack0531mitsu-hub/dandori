<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ダンドリ｜課題と家事を、今日やる順番に。</title>
<meta name="description" content="授業名を書くだけで締切が決まり、空き時間から「今日やる順番」を出す、大学生のための段取りアプリ。課題・家事・バイトのシフトをまとめて管理。">
<meta name="theme-color" content="#FFF3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18131F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ダンドリ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:title" content="ダンドリ｜課題と家事を、今日やる順番に。">
<meta property="og:description" content="授業名を書くだけで締切が決まり、空き時間から「今日やる順番」を出す、大学生のための段取りアプリ。課題・家事・バイトのシフトをまとめて管理。">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 手帳の「1日のページ」。上に使える時間と時間帯ストリップ、その下に今日の段取り。4つの画面は下のタブで切り替える */
:root{
  --paper:#FFF6F9; --surface:#FFFFFF; --sunk:#FCEBF2;
  --ink:#3A2E45; --ink-2:#76687F; --ink-3:#A496B0;
  --line:#F2DAE5; --grid:#F6E6EE;
  --study:#7C6CF2; --study-soft:#EEEBFF;
  --life:#1FA787; --life-soft:#DBF5EE;
  --other:#E5853F; --other-soft:#FFEDE1;
  --busy:#E9CFDC;
  --marker:#FFC4DC;
  --warn:#E04375; --warn-soft:#FFE4EC;
  --focus:#7C6CF2;
  --scrim:rgba(40,20,40,.42);
  --edit:#FFF8D6; --edit-line:#E3C445; --edit-ink:#8A6D00;
  --etc:#2F93D8; --etc-soft:#E0F1FF; --band:rgba(124,108,242,.05); --stripe:#FBD6C0;
  --accent:#FF77AE; --accent-ink:#FFFFFF; --accent-deep:#E45A93; --accent-soft:#FFD9E8; --accent-text:#C73E78;
  --shadow:0 2px 0 rgba(200,90,140,.05),0 8px 22px rgba(200,90,140,.09);
  --bg:linear-gradient(180deg,#FFF3F7 0%,#F6F1FF 100%);
  --font-display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18131F; --surface:#221B2B; --sunk:#2C2436;
    --ink:#F3ECF6; --ink-2:#BBAFC6; --ink-3:#8A7E96;
    --line:#3A2F45; --grid:#2E2638;
    --study:#ADA2FF; --study-soft:#2D2750;
    --life:#62D9B8; --life-soft:#163229;
    --other:#F7B488; --other-soft:#3A2A1F;
    --busy:#4B3F57;
    --marker:#7A3558;
    --warn:#FF86A8; --warn-soft:#41202E;
    --focus:#ADA2FF;
    --scrim:rgba(0,0,0,.6);
    --edit:#28220F; --edit-line:#7A6B22; --edit-ink:#E8CF5A;
    --etc:#86CBF7; --etc-soft:#1B2C3B; --band:rgba(173,162,255,.06); --stripe:#4A3626;
    --accent:#FF77AE; --accent-ink:#FFFFFF; --accent-deep:#C94A80; --accent-soft:#4A2238; --accent-text:#FF9CC5;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.28);
    --bg:#18131F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#18131F; --surface:#221B2B; --sunk:#2C2436;
  --ink:#F3ECF6; --ink-2:#BBAFC6; --ink-3:#8A7E96;
  --line:#3A2F45; --grid:#2E2638;
  --study:#ADA2FF; --study-soft:#2D2750;
  --life:#62D9B8; --life-soft:#163229;
  --other:#F7B488; --other-soft:#3A2A1F;
  --busy:#4B3F57;
  --marker:#7A3558;
  --warn:#FF86A8; --warn-soft:#41202E;
  --focus:#ADA2FF;
  --scrim:rgba(0,0,0,.6);
  --edit:#28220F; --edit-line:#7A6B22; --edit-ink:#E8CF5A;
  --etc:#86CBF7; --etc-soft:#1B2C3B; --band:rgba(173,162,255,.06); --stripe:#4A3626;
  --accent:#FF77AE; --accent-ink:#FFFFFF; --accent-deep:#C94A80; --accent-soft:#4A2238; --accent-text:#FF9CC5;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.28);
  --bg:#18131F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper);background-image:var(--bg);min-height:100%}
body{background:transparent;color:var(--ink);font-family:var(--font-body);font-size:15px;font-weight:500;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:10px;padding-block:4px 0}
.logo{font-family:var(--font-display);font-size:22px;line-height:1;letter-spacing:.03em;padding:2px 3px;background:linear-gradient(transparent 56%,var(--marker) 56%,var(--marker) 94%,transparent 94%)}
.sync{margin-left:auto;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.cloud::before{background:var(--life)}
.sync.local::before{background:var(--other)}
.samplebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:3px 12px;font-size:13px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ink-2);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link.inv{color:var(--paper)}

/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:999px;background:var(--sunk)}
.seg button,.segopt span{display:inline-block;padding:4px 12px;border-radius:999px;border:0;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"],.segopt input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.segopt{position:relative}
.segopt input{position:absolute;opacity:0;width:1px;height:1px}
.segopt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:1px}

/* today */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.date{font-size:20px;font-weight:700;margin:0;font-variant-numeric:tabular-nums}
.alerts{display:grid;gap:6px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.alert b{color:var(--warn);font-size:12px;letter-spacing:.04em;white-space:nowrap}
.alert.lv1{background:var(--sunk)}
.alert.lv1 b{color:var(--ink-2)}
.alert span{min-width:0;overflow-wrap:anywhere}
.hero{display:grid;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.cap-label{font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.cap{font-family:var(--font-display);font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums;margin-block:2px}
.cap mark{color:inherit;padding:0 3px;background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 92%,transparent 92%)}
.cap-sub{font-size:12px;color:var(--ink-2)}
.strip-wrap{display:grid;gap:4px}
.strip{position:relative;height:30px;border-radius:6px;background:var(--sunk);overflow:hidden}
.blk{position:absolute;top:0;bottom:0;display:block}
.blk.busy{background:repeating-linear-gradient(135deg,var(--busy) 0 4px,transparent 4px 8px)}
.blk.past{background:var(--grid)}
.blk.study{background:var(--study)}
.blk.life{background:var(--life)}
.blk.other{background:var(--other)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);display:block}
.ticks{position:relative;height:16px;font-size:11px;color:var(--ink-3)}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
.ticks span.l{transform:none}
.ticks span.r{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:12px;height:8px;border-radius:2px}
.sw.busy{background:repeating-linear-gradient(135deg,var(--busy) 0 2px,transparent 2px 4px);box-shadow:0 0 0 1px var(--busy)}
.sw.study{background:var(--study)} .sw.life{background:var(--life)} .sw.other{background:var(--other)}
.bal{display:grid;gap:6px}
.bal-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.bal-head b{color:var(--ink);font-weight:500;margin-left:4px}
.bal-track{position:relative}
.bal-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.bal-bar i{display:block;height:100%}
.bal-bar i.study{background:var(--study)} .bal-bar i.life{background:var(--life)}
.bal-target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.bal-note{font-size:12px;color:var(--ink-3)}

/* adder */
.adder{display:grid;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.adder-row{display:flex;gap:8px}
.adder-row input{flex:1;min-width:0}
.adder-opts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.tog{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--ink)}
.hint{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;min-width:0;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
input[type=range]{width:100%;accent-color:var(--ink)}
textarea{font:inherit;color:inherit;width:100%;min-width:0;min-height:88px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);resize:vertical}
textarea.code{font-family:var(--font-mono);font-size:12px;line-height:1.5;word-break:break-all}
.h3{font-size:14px;font-weight:700;margin:0}
.backup{display:grid;gap:8px;padding:12px 14px;border-radius:10px;border:1px dashed var(--other);background:var(--other-soft);font-size:14px}
.backup .acts,.inapp .acts{display:flex;flex-wrap:wrap;gap:8px}
.inapp{display:grid;gap:8px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:13px}
.inapp b{color:var(--warn)}
.inapp.a2hs{background:var(--sunk)}
.inapp.a2hs b{color:var(--ink)}
.preview{display:grid;gap:4px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.warnnote{color:var(--warn)}

/* sections, lists */
.sect{display:grid;gap:10px}
.h1{font-size:22px;font-weight:700;margin:2px 0 0;text-wrap:balance}
.h2{font-size:16px;font-weight:700;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.h2-sub{font-size:12px;font-weight:500;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-2);margin:0}
.plan{display:grid;gap:8px}
.item{display:grid;grid-template-columns:3.4em 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.item.ordered{grid-template-columns:32px 1fr auto}
.ord{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--font-mono);font-weight:500;font-size:15px;color:var(--ink-2)}
.ord.first{background:var(--marker);color:var(--ink)}
.item.is-next{border-color:var(--ink-3);padding-block:16px}
.item.is-next .title{font-size:17px}
.nextlabel{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);margin-bottom:2px}
.sw.free{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.time{display:grid;font-family:var(--font-mono);font-size:12px;line-height:1.35;color:var(--ink-2);font-variant-numeric:tabular-nums}
.time span:first-child{color:var(--ink);font-size:13px}
.body{min-width:0}
.title{font-weight:700;overflow-wrap:anywhere;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:12px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.6}
.tag.study{background:var(--study-soft);color:var(--study)}
.tag.life{background:var(--life-soft);color:var(--life)}
.tag.other{background:var(--other-soft);color:var(--other)}
.tag.hot{background:var(--warn-soft);color:var(--warn)}
.tag.plain{background:var(--sunk);color:var(--ink-2)}
.check{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.check::after{content:"✓";font-size:16px;font-weight:700;color:var(--ink-3)}
.check.study{border-color:var(--study)} .check.life{border-color:var(--life)} .check.other{border-color:var(--other)}
.check:hover::after{color:var(--ink)}
.prio{font-size:12px;color:var(--ink-2)}
.rest{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.rrow:first-child{border-top:0}
.rrow .meta{margin:0;flex:none}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink-2);font-size:14px;display:grid;gap:10px;justify-items:start}
.foot{font-size:12px;color:var(--ink-3);margin:0}
details.done{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:0 12px}
details.done summary{cursor:pointer;padding:10px 0;font-size:14px;font-weight:500}
.drow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.tlist{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.trow.two{grid-template-columns:1fr auto}
.days .segopt input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:none}
.grade{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 6px;border-radius:6px;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.02em;line-height:1;background:var(--sunk);color:var(--ink-2)}
.grade.big{min-width:36px;height:32px;font-size:15px;border-radius:8px}
.g-SS{background:var(--warn);color:var(--paper)}
.g-S{background:var(--warn-soft);color:var(--warn)}
.g-A{background:var(--marker);color:var(--ink)}
.g-B{background:var(--sunk);color:var(--ink)}
.g-C{background:var(--sunk);color:var(--ink-2)}
.g-D,.g-E{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.drow .gdesc{flex:1;color:var(--ink)}
.drow:has(.grade){justify-content:flex-start;align-items:center}
.gnote{padding:8px 0 10px}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets-label{font-size:12px;color:var(--ink-2);margin-right:4px}
.chip{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--life)}

/* timetable */
.tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.tt{border-collapse:collapse;width:100%;min-width:330px;table-layout:fixed}
.tt th,.tt td{border-bottom:1px solid var(--grid);padding:4px}
.tt thead th{font-size:13px;font-weight:700;padding-block:8px;color:var(--ink-2)}
.tt tbody th{text-align:left;font-weight:500}
.tt thead th:first-child{width:3.2em}
.tt tr:last-child th,.tt tr:last-child td{border-bottom:0}
.pn{display:block;font-weight:700;font-size:14px}
.pt{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.cell{width:100%;min-height:44px;padding:4px;border-radius:6px;border:1px dashed var(--line);background:transparent;font-size:12px;line-height:1.3;color:var(--ink-3);cursor:pointer;overflow-wrap:anywhere}
.cell.on{border:0;background:var(--study-soft);color:var(--study);font-weight:500}
.cell{position:relative}
.cell .wkdot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--study)}
.tag.wk{background:var(--sunk);color:var(--ink-2)}
.tag.etc{background:var(--etc-soft);color:var(--etc)}
/* 時間割：時間の目盛りで1週間（見る／編集） */
.h1row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h1row .btn svg{width:14px;height:14px}
.wk-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 6px 10px 4px}
.wk-card.editing{background:var(--edit);border-color:var(--edit-line)}
.wk-head{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));font-size:12px;font-weight:700;color:var(--ink-2);text-align:center;margin-bottom:6px}
.wk-head .sun{color:var(--warn)}
.wk-d{display:grid;justify-items:center;gap:2px}
.wk-d .w{font-size:11px}
.wk-d .n{font-size:14px;font-weight:700;color:var(--ink);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.wk-d.sun .w,.wk-d.sun .n{color:var(--warn)}
.wk-d.past .n{color:var(--ink-3)}
.wk-d.today .n{background:var(--ink);color:var(--paper)}
.wk-d .cnt{display:inline-flex;align-items:center;gap:2px;height:15px;padding:0 5px;border-radius:8px;font-size:10px;font-family:var(--font-mono);font-weight:700;background:var(--ink);color:var(--paper)}
.wk-d .cnt.u{background:var(--warn)}
.wk-d .cnt::before{content:"";width:5px;height:7px;background:currentColor;clip-path:polygon(0 0,100% 50%,0 100%)}
.wk-d .cnt.none{visibility:hidden}
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-arr{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;color:var(--ink-2);cursor:pointer}
.wk-range{flex:1;display:grid;justify-items:center;gap:1px;text-align:center}
.wk-range b{font-size:15px}
.wk-range span,.wk-range .link{font-size:12px;color:var(--ink-2)}
.wk-dl{position:absolute;left:0;right:0;height:16px;margin:0;padding:0;border:0;background:transparent;cursor:pointer;z-index:3;--c:var(--ink)}
.wk-dl.u{--c:var(--warn)}
.wk-dl::before{content:"";position:absolute;left:0;right:0;top:7px;border-top:1.5px solid var(--c)}
.wk-dl::after{content:"";position:absolute;left:-1px;top:2px;width:9px;height:12px;background:var(--c);clip-path:polygon(0 0,100% 50%,0 100%)}
.wk-legend .flg{display:inline-block;width:8px;height:10px;background:var(--warn);clip-path:polygon(0 0,100% 50%,0 100%);margin-right:4px;vertical-align:-1px}
.wk-legend .nowk{display:inline-block;width:14px;height:0;border-top:1.5px solid var(--ink);margin-right:4px;vertical-align:3px}
.wk-dlist{display:grid;gap:6px}
.wk-drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;color:inherit;cursor:pointer}
.wk-drow .when{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);line-height:1.3;text-align:center;min-width:50px}
.wk-drow .when b{display:block;font-family:var(--font-body);font-size:12px;color:var(--ink)}
.wk-drow .ttl{font-size:14px;font-weight:700;line-height:1.35}
.wk-drow .ttl small{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
.wk-drow.done{opacity:.6}
.wk-drow.done .ttl{text-decoration:line-through}
.wk-drow .chk{color:var(--ink-3);font-size:14px;padding:0 8px}
.wk-pop .prow{display:flex;align-items:center;gap:6px;margin-top:4px}
.datebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 10px 4px 8px;font:inherit;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.datebtn svg{width:18px;height:18px;color:var(--ink-2);flex:none}
.datebtn .car{font-size:11px;color:var(--ink-2)}
.wk-range .rbtn{border:0;background:transparent;font:inherit;font-size:15px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:2px 4px}
.wk-range .rbtn svg{width:15px;height:15px;color:var(--ink-2)}
.mc{display:grid;gap:12px}
.mc-h{display:flex;align-items:center;gap:8px}
.mc-h b{flex:1;font-size:18px}
.mc-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mc-w{font-size:11px;font-weight:700;color:var(--ink-2);text-align:center;padding-bottom:4px}
.mc-w.sun{color:var(--warn)}
.mc-d{height:58px;border:0;border-radius:10px;background:transparent;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;cursor:pointer;min-width:0}
.mc-d .n{font-family:var(--font-mono);font-size:14px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mc-d.out .n{color:var(--ink-3);opacity:.6}
.mc-d.past .n{color:var(--ink-3)}
.mc-d.sun .n{color:var(--warn)}
.mc-d.today .n{box-shadow:inset 0 0 0 2px var(--ink)}
.mc-d.sel{background:var(--sunk)}
.mc-d.sel .n{background:var(--ink);color:var(--paper)}
.mc-d .cnt{display:inline-flex;align-items:center;gap:2px;height:14px;padding:0 4px;border-radius:7px;font-size:9.5px;font-family:var(--font-mono);font-weight:700;background:var(--ink);color:var(--paper)}
.mc-d .cnt.u{background:var(--warn)}
.mc-d .cnt::before{content:"";width:4px;height:6px;background:currentColor;clip-path:polygon(0 0,100% 50%,0 100%)}
.mc-d .sh{display:block;width:22px;height:4px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--other) 0 3px,var(--stripe) 3px 5px)}
.mc-d.past .sh,.mc-d.out .sh{opacity:.45}
.mc-legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);align-items:center}
.mc-legend i{display:inline-block;vertical-align:-1px;margin-right:4px}
.mc-day{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.mc-day h3{margin:0;font-size:16px}
.mc-sec{display:grid;gap:4px}
.mc-sec .lab{font-size:12px;font-weight:700;color:var(--ink-2)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);padding:7px 10px;border-radius:8px;background:var(--paper);border:0}
button.mrow{cursor:pointer}
.mrow .tm{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);min-width:44px}
.mrow .k{width:4px;align-self:stretch;border-radius:2px}
.mrow.done{opacity:.55}
.mrow.done .t{text-decoration:line-through}
.wk-pop .pacts{display:flex;gap:6px;margin-top:8px}
.wk-pop .stag{display:inline-block;font-size:10px;font-weight:700;background:var(--other-soft);color:var(--other);border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px}
.btn.accent{background:var(--other-soft);border-color:var(--other);color:var(--other);font-weight:700}
.h1row .h1{margin-right:auto}
.h1row{justify-content:flex-start}
.wk-blk.shift{background:repeating-linear-gradient(135deg,var(--other-soft) 0 5px,var(--stripe) 5px 9px);color:var(--other);border-left:3px solid var(--other);font-weight:700}
.wk-legend .shift-i{background:repeating-linear-gradient(135deg,var(--other-soft) 0 3px,var(--stripe) 3px 5px);box-shadow:inset 3px 0 0 var(--other)}
.sf-chips{display:flex;flex-wrap:wrap;gap:6px}
.sf-chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink);cursor:pointer}
.sf-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.sf-chip.add{border-style:dashed;color:var(--ink-2)}
.sf-chip.add.on{border-style:solid;color:var(--paper)}
.sf-chip.mono{font-family:var(--font-mono)}
.sf-cal{border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px}
.sf-cal .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.sf-cal .mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.sf-cal .mw{font-size:11px;color:var(--ink-2);font-weight:700}
.sf-cal .mw.sun{color:var(--warn)}
.sf-cal .md{position:relative;height:40px;border:0;border-radius:10px;background:transparent;font:inherit;font-family:var(--font-mono);font-size:14px;color:var(--ink);cursor:pointer;padding:0}
.sf-cal .md.sun{color:var(--warn)}
.sf-cal .md.past{color:var(--ink-3);cursor:default}
.sf-cal .md.today{box-shadow:inset 0 0 0 2px var(--ink)}
.sf-cal .md.on{background:var(--ink);color:var(--paper);font-weight:700}
.sf-cal .md i{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--other)}
.sf-cal .md.on i{background:var(--paper)}
.sf-cal .note{font-size:11px}
.sf-range{display:flex;align-items:center;gap:8px}
.sf-range input[type=time]{width:auto;max-width:9em}
.sf-picked{display:grid;gap:6px}
.sf-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px}
.sf-row.ov{border-color:var(--warn)}
.sf-row .d{font-size:13px;font-weight:700;min-width:56px}
.sf-row .t{display:flex;align-items:center;gap:4px;min-width:0}
.sf-row .t input[type=time]{flex:1 1 0;width:auto;min-width:0;max-width:none;min-height:34px;padding:2px 4px;font-size:13px;letter-spacing:-.01em}
.sf-row .x{border:0;background:transparent;font-size:18px;color:var(--ink-3);width:30px;height:34px;padding:0;cursor:pointer}
.sf-row .w{grid-column:1/-1;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 8px}
.wk-pop .pacts button{border:0;border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;font-weight:700;background:var(--paper);color:var(--ink);cursor:pointer}
.wk-pop .pacts button.g{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px currentColor}
.wk-body{position:relative;display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr))}
.wk-axis{position:relative}
.wk-axis .h{position:absolute;right:5px;transform:translateY(-50%);font-size:10px;font-family:var(--font-mono);color:var(--ink-3)}
.wk-axis .pn{position:absolute;left:1px;transform:translateY(-50%);width:17px;height:17px;border-radius:50%;background:var(--sunk);color:var(--ink-2);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.editing .wk-axis .pn{background:var(--ink);color:var(--paper)}
.wk-col{position:relative;border-left:1px solid var(--grid)}
.wk-hl{position:absolute;left:40px;right:0;height:0;border-top:1px solid var(--grid);pointer-events:none}
.wk-band{position:absolute;left:40px;right:0;background:var(--band);pointer-events:none}
.editing .wk-band{background:transparent}
.wk-blk{position:absolute;left:2px;right:2px;margin:0;border:0;border-radius:6px;font:inherit;font-size:10px;line-height:1.2;padding:3px;overflow:hidden;font-weight:500;text-align:left;display:block;cursor:pointer;overflow-wrap:anywhere;z-index:1}
.wk-blk .tm{display:block;font-family:var(--font-mono);font-size:8.5px;letter-spacing:-.02em;white-space:nowrap;opacity:.85;margin-top:1px}
.wk-blk.cls{background:var(--study-soft);color:var(--study);border-left:3px solid var(--study)}
.wk-blk.job{background:var(--other-soft);color:var(--other);border-left:3px solid var(--other);font-weight:700}
.wk-blk.cir{background:var(--life-soft);color:var(--life);border-left:3px solid var(--life);font-weight:700}
.wk-blk.etc{background:var(--etc-soft);color:var(--etc);border-left:3px solid var(--etc);font-weight:700}
.editing .wk-blk{box-shadow:0 1px 2px rgba(0,0,0,.12)}
.wk-blk.ovl{box-shadow:inset 0 0 0 2px var(--warn)}
.wk-blk .ov{position:absolute;right:2px;bottom:2px;width:14px;height:14px;border-radius:50%;background:var(--warn);color:var(--paper);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wk-blk .wkdot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--study)}
.wk-slot{position:absolute;left:2px;right:2px;margin:0;padding:0;border:1.5px dashed var(--edit-line);border-radius:6px;background:transparent;color:var(--edit-ink);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wk-now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--ink);opacity:.8;z-index:2;pointer-events:none}
.wk-now::before{content:"";position:absolute;left:-3px;top:-4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.wk-pop{position:absolute;z-index:5;max-width:260px;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.55;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.wk-pop b{font-size:13px}
.wk-pop .sub{opacity:.72;font-size:11px}
.wk-pop .warnline{color:var(--warn-soft);font-weight:700}
.wk-banner{display:flex;gap:10px;align-items:flex-start;background:var(--edit);border:1px solid var(--edit-line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.55}
.wk-banner b{white-space:nowrap;color:var(--edit-ink)}
.wk-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.wk-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wk-warn{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:7px 10px;line-height:1.55}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* intro */
.intro{display:grid;gap:14px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.intro-h{font-size:22px;line-height:1.45;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--ink-2)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;column-gap:10px}
.steps li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--marker);font-family:var(--font-mono);font-weight:500;color:var(--ink)}
.steps b{font-weight:700}
.steps span{font-size:13px;color:var(--ink-2)}
.intro-acts{display:flex;flex-wrap:wrap;gap:8px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{min-height:56px;border:0;background:none;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:30%;right:30%;bottom:10px;height:5px;border-radius:3px;background:var(--marker)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sh-title{font-size:18px;font-weight:700;margin:0;overflow-wrap:anywhere}
.sh-acts{display:flex;flex-wrap:wrap;gap:8px}
.f{display:grid;gap:4px;min-width:0}
.f label,.flabel{font-size:12px;color:var(--ink-2);font-weight:500}
.f .link{justify-self:start;margin-top:2px}
.callist{display:grid;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.crow{display:grid;gap:2px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.crow:first-child{border-top:0}
.crow .meta{margin-top:0}
.howto{margin:0 0 4px;padding-left:1.4em;display:grid;gap:4px;font-size:14px}
.rowcard .link{justify-self:start}
.rowcard input[type=time]{width:auto;max-width:11em;justify-self:start}
.morning{display:grid;gap:8px;padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.greet{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
.mline{margin:0;font-size:17px;line-height:1.6;font-weight:500;overflow-wrap:anywhere}
.mline b{font-weight:700;padding:0 2px;background:linear-gradient(transparent 60%,var(--marker) 60%,var(--marker) 92%,transparent 92%)}
.streak{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.snum{display:flex;align-items:baseline;gap:2px;min-width:3.2em}
.snum b{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.snum span{font-size:14px;font-weight:700}
.stext{display:grid;gap:1px;font-size:14px;min-width:0}
.slabel{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
.ssub{font-size:12px;color:var(--ink-3)}
.autonote{padding:8px 10px;border-radius:8px;background:var(--study-soft);color:var(--study)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f2 input{min-width:0;max-width:100%}
/* iPhoneの日付・時刻の欄が、中身の幅に引っぱられて横にはみ出すのを防ぐ */
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-width:0}
input::-webkit-date-and-time-value{text-align:left}
.rowcard{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px}
.stepper{display:flex;gap:6px;align-items:center}
.stepper input{width:6em;flex:none;text-align:center}
.days{display:flex;flex-wrap:wrap;gap:4px}
.ptimes{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:2.4em 1fr auto 1fr;gap:6px;align-items:center;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 32px));display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14px}

/* ===== パステルの見た目（カードは枠線なし＋ふんわり影） ===== */
.morning,.adder,.item,.trow,details.done,.rest,.wk-card,.wk-drow,.callist,.intro{border-color:transparent;box-shadow:var(--shadow)}
.item.is-next{border:2.5px solid var(--accent)}
.alert{border-radius:16px}
.check{border-width:2.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;box-shadow:0 3px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.primary:hover{border-color:var(--accent)}
.ord.first{background:var(--accent);color:#fff}
.wk-d.today .n{background:var(--accent);color:#fff}
.logo{font-size:23px;letter-spacing:.02em;font-weight:400}
.toast{border-radius:16px}
[data-act=ics]{white-space:normal;text-align:left}
.tabs{border-top:0;box-shadow:0 -4px 18px rgba(120,40,80,.08);border-radius:24px 24px 0 0}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;font-size:11px}
.tabs .ti{width:48px;height:30px;border-radius:15px;display:grid;place-items:center}
.tabs .ti svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent-text)}
.tabs button[aria-current="page"]::after{display:none}
.tabs button[aria-current="page"] .ti{background:var(--accent-soft)}
/* 「？」：押すと説明が出る */
.qm{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;border-radius:50%;border:1.5px solid var(--ink-3);background:transparent;color:var(--ink-3);font-size:11px;font-weight:700;line-height:1;cursor:pointer;margin-left:6px;vertical-align:2px;flex:none}
.h2 .qm{margin-right:auto}
.h1 .qm{vertical-align:4px}
.help p{margin:0;font-size:14px;line-height:1.7}
.help .drow{color:var(--ink)}
/* ナマケ先輩のカード */
.sq-row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center}
.sq-row .sq svg{width:78px;height:110px;margin:-6px 0 -8px -6px;display:block}
.bubble{position:relative;background:var(--sunk);border-radius:18px;padding:10px 13px;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:10px solid var(--sunk);border-left:0}
.bubble .greet{font-family:var(--font-display);font-weight:400;color:var(--accent-text);font-size:14px;letter-spacing:0}
.bubble .mline{margin:2px 0 0;font-size:14.5px;line-height:1.6}
.bubble .mline b.ok{color:var(--life);background:none;padding:0}
.bubble .mline b.ng{color:var(--accent-text);background:none;padding:0}
.cond{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cond>span{font-size:12px;font-weight:700;color:var(--ink-2)}
.alert:has(.mini){grid-template-columns:34px 1fr;align-items:center}

<body>

<script>
(() => {
'use strict';

/* ---------- 基本の道具 ---------- */
const WD = ['日','月','火','水','木','金','土'];
const CAT = {study:'学業', life:'生活', other:'その他'};
const IMP = [0, 0.8, 1, 1.3];
const COND = {good:{label:'元気', m:1}, normal:{label:'ふつう', m:0.85}, tired:{label:'お疲れ', m:0.6}};
const SID = Math.random().toString(36).slice(2);
const LS_KEY = 'dandori.v1', LS_VIEW = 'dandori.view';
// claude.ai の外（自分のWebアドレスやアプリ）で動いているとき true。保存は端末、ファイルは普通のダウンロードで渡す
const IS_WEB = !(window.claude && typeof window.claude.use === 'function');
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = (() => { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } })();
// 感想フォーム（GoogleフォームのURL）。空のあいだは設定画面にボタンを出さない
const FEEDBACK_URL = 'https://forms.gle/vNWosybxXnKr1gSEA';
const EXTRA_PERIODS = [['18:30','20:00'],['20:15','21:45']];

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const todayStr = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const toMin = s => { const [h,m] = String(s || '0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const clock = m => `${Math.floor(m/60)}:${pad(m%60)}`;
const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m/60), r = m % 60; return h ? `${h}時間${r ? r + '分' : ''}` : `${r}分`; };
const round5 = m => Math.max(5, Math.round((Number(m) || 0) / 5) * 5);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const md = s => { const d = parseYmd(s); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 状態 ---------- */
function defaults(){
  return {
    v:1, rev:0, sid:'', sample:false,
    tasks:[], routines:[], timetable:{},
    periods:[['08:45','10:15'],['10:30','12:00'],['13:15','14:45'],['15:00','16:30'],['16:45','18:15']],
    jobs:[],
    settings:{dayStart:'09:00', dayEnd:'23:30', buffer:10, studyRatio:0.75, courseDue:'before', showTimes:false, morningOn:true, morningTime:'07:30'},
    doneDays:{}, best:0,
    backupAt:null, nagUntil:null,
    weekly:[], shifts:[], places:[],
    cond:{},
    learn:{study:{r:1,n:0}, life:{r:1,n:0}, other:{r:1,n:0}},
    log:[]
  };
}
function merge(d){
  const b = defaults();
  if (!d || typeof d !== 'object') return b;
  // クラウドから届くデータは書き換え禁止（凍結）なので、まるごと複製してから使う
  try { d = JSON.parse(JSON.stringify(d)); } catch (e) { return b; }
  return {
    ...b, ...d,
    settings:{...b.settings, ...(d.settings || {})},
    learn:{
      study:{...b.learn.study, ...((d.learn || {}).study || {})},
      life:{...b.learn.life, ...((d.learn || {}).life || {})},
      other:{...b.learn.other, ...((d.learn || {}).other || {})}
    },
    tasks:Array.isArray(d.tasks) ? d.tasks : [],
    routines:Array.isArray(d.routines) ? d.routines : [],
    jobs:Array.isArray(d.jobs) ? d.jobs : [],
    weekly:Array.isArray(d.weekly) ? d.weekly : [],
    shifts:Array.isArray(d.shifts) ? d.shifts : [],
    places:Array.isArray(d.places) ? d.places : [],
    periods:Array.isArray(d.periods) && d.periods.length ? d.periods : b.periods,
    timetable:d.timetable && typeof d.timetable === 'object' ? d.timetable : {},
    cond:d.cond && typeof d.cond === 'object' ? d.cond : {},
    log:Array.isArray(d.log) ? d.log : [],
    // 「やった日」の記録。古いデータには無いので、完了の記録から作る
    doneDays:d.doneDays && typeof d.doneDays === 'object' ? d.doneDays : (Array.isArray(d.log) ? d.log : []).reduce((m, x) => { if (x && x.d) m[x.d] = (m[x.d] || 0) + 1; return m; }, {}),
    best:Number(d.best) || 0
  };
}
const hasData = s => !!s && ((s.tasks || []).length > 0 || (s.routines || []).length > 0 || Object.keys(s.timetable || {}).length > 0 || (s.jobs || []).length > 0);

let S = defaults();
const UI = {view:'today', day:'today', filter:'all', sheet:null, ai:true, undo:null, ctl:null, tt:null, ttEdit:false, weekOff:0};
try { const v = localStorage.getItem(LS_VIEW); if (['today','tasks','routines','week'].includes(v)) UI.view = v; } catch (e) {}

/* ---------- 保存（クラウド＝本人だけの領域 / 使えなければこの端末） ---------- */
const store = {mode:'loading', ref:null, writing:false, again:false, timer:null, retries:0};
let sampleFn = null, dlFn = null;

function loadLocal(){ try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

function commit(){
  S.rev = (S.rev || 0) + 1; S.sid = SID;
  prune();
  render();
  clearTimeout(store.timer);
  store.timer = setTimeout(flush, 400);
}
async function flush(){
  if (store.mode === 'cloud' && store.ref){
    if (store.writing){ store.again = true; return; }
    store.writing = true;
    try {
      await store.ref.set(JSON.parse(JSON.stringify(S)));
      store.retries = 0;
    } catch (e) {
      const code = e && e.code;
      if (code === 'unavailable' && store.retries < 2){ store.retries++; store.again = true; }
      else if (code === 'quota_exceeded'){ toast('保存できる量の上限です。終わったタスクや古い予定を消してください'); }
      else { store.mode = 'local'; saveLocal(); render(); toast('この共有のしかたではクラウドに保存できないため、この端末に保存します'); }
    } finally {
      store.writing = false;
      if (store.again){ store.again = false; setTimeout(flush, 500 + Math.random()*500); }
    }
  } else if (store.mode === 'local'){
    saveLocal();
  }
}
function prune(){
  const today = todayStr();
  S.log = S.log.slice(-80);
  S.tasks = S.tasks.filter(t => !t.done || !t.doneAt || daysBetween(t.doneAt, today) <= 30);
  for (const k of Object.keys(S.cond)) if (daysBetween(k, today) > 14) delete S.cond[k];
  for (const k of Object.keys(S.doneDays)) if (daysBetween(k, today) > 150) delete S.doneDays[k];
  S.shifts = (S.shifts || []).filter(x => x && x.date && daysBetween(x.date, today) <= 60);
}
async function boot(){
  render();
  const c = window.claude;
  let db = null, user = null;
  if (c && typeof c.use === 'function'){
    try { [db, user, sampleFn, dlFn] = await Promise.all([c.use('db'), c.use('user'), c.use('sample'), c.use('downloads')]); } catch (e) {}
  }
  if (IS_WEB && !dlFn) dlFn = {save:async ({filename, data}) => {
    const blob = data instanceof Blob ? data : new Blob([data], {type:/\.ics$/.test(filename) ? 'text/calendar' : 'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return {status:'saved'};
  }};
  let id = null;
  try { id = user ? await user.id() : null; } catch (e) {}
  if (db && id){
    try {
      // 「見るだけ」の共有で開いた人はクラウドに書けない。分かる場合は最初から端末保存にする
      let canWrite = null;
      try { canWrite = await user.can('data.write'); } catch (e) {}
      if (canWrite === false) throw new Error('readonly');
      store.ref = db.doc(`data/users/${id}/app`);
      const snap = await store.ref.get();
      if (snap.exists) S = merge(snap.data());
      else {
        // 初めて開いた人：書けるかどうかを1回だけ試す（断られたら、途中でエラーを出さずに端末保存へ）
        const l = loadLocal();
        S = merge(hasData(l) ? l : null);
        await store.ref.set(JSON.parse(JSON.stringify(S)));
      }
      store.mode = 'cloud';
      store.ref.onSnapshot(onSnap, () => {});
    } catch (e) {
      store.mode = 'local'; store.ref = null; S = merge(loadLocal());
    }
  } else {
    store.mode = 'local'; S = merge(loadLocal());
  }
  if (!checkWeekly()) render();
}
function onSnap(snap){
  if (!snap || !snap.exists || (snap.metadata && snap.metadata.hasPendingWrites)) return;
  const d = snap.data();
  if (d && d.sid !== SID && (d.rev || 0) > (S.rev || 0)){ S = merge(d); render(); }
}

/* ---------- 空き時間の計算 ---------- */
function busyFor(date){
  const wd = parseYmd(date).getDay();
  const out = [];
  if (wd >= 1 && wd <= 6){
    S.periods.forEach((p, i) => {
      const name = S.timetable[`${wd}-${i+1}`];
      if (name) out.push({s:toMin(p[0]), e:toMin(p[1]), label:name});
    });
  }
  S.jobs.filter(j => j.wd === wd).forEach(j => out.push({s:toMin(j.start), e:toMin(j.end), label:j.label || 'バイト'}));
  shiftsOn(date).forEach(x => out.push({s:toMin(x.start), e:toMin(x.end), label:x.place || 'バイト'}));
  return out.sort((a, b) => a.s - b.s);
}
function freeFor(date, fromMin){
  const st = S.settings;
  let ws = toMin(st.dayStart); const we = toMin(st.dayEnd);
  if (fromMin != null) ws = Math.max(ws, Math.ceil(fromMin / 5) * 5);
  if (we <= ws) return [];
  const buf = Number(st.buffer) || 0;
  const busy = busyFor(date).map(b => ({s:b.s - buf, e:b.e + buf}));
  const free = []; let cur = ws;
  for (const b of busy){
    if (b.e <= cur) continue;
    if (b.s > cur) free.push({s:cur, e:Math.min(b.s, we)});
    cur = Math.max(cur, b.e);
    if (cur >= we) break;
  }
  if (cur < we) free.push({s:cur, e:we});
  return free.filter(f => f.e - f.s >= 15);
}
const sumFree = fr => fr.reduce((a, f) => a + f.e - f.s, 0);
const condOf = date => COND[S.cond[date]] ? S.cond[date] : 'normal';

/* ---------- 時間割から課題の締切を決める ---------- */
const normName = s => String(s || '').normalize('NFKC').toLowerCase().replace(/[\s・･()（）「」『』【】\[\]_\-]/g, '');
const courseNames = () => [...new Set(Object.values(S.timetable).filter(Boolean))];
function matchCourse(title){
  const t = normName(title); if (!t) return null;
  let best = null;
  for (const c of courseNames()){
    const n = normName(c);
    if (n.length >= 2 && t.includes(n) && (!best || n.length > normName(best).length)) best = c;
  }
  if (best) return best;
  // 略した書き方（例：「民法 課題」→「民法総則」）。候補が1つに絞れるときだけ使う
  const tokens = String(title).normalize('NFKC').split(/[\s、,・]+/).map(normName).filter(x => x.length >= 2);
  const hits = courseNames().filter(c => tokens.some(tk => normName(c).startsWith(tk)));
  return hits.length === 1 ? hits[0] : null;
}
function nextClass(course, fromDate, fromMin){
  for (let i = 0; i <= 14; i++){
    const ds = addDays(fromDate, i), wd = parseYmd(ds).getDay();
    if (wd < 1 || wd > 6) continue;
    for (let p = 0; p < S.periods.length; p++){
      if (S.timetable[`${wd}-${p+1}`] !== course) continue;
      if (i === 0 && toMin(S.periods[p][0]) <= fromMin) continue;
      return {date:ds, start:S.periods[p][0], wd, period:p+1};
    }
  }
  return null;
}
function courseDue(course){
  const today = todayStr();
  const nc = nextClass(course, today, nowMin()); if (!nc) return null;
  const when = `${md(nc.date)} ${nc.period}限（${nc.start}〜）`;
  if (S.settings.courseDue === 'daybefore' && addDays(nc.date, -1) >= today)
    return {deadline:addDays(nc.date, -1), dueTime:null, course, note:`時間割の「${course}」から、次の授業 ${when} の前日を締切にしました`};
  return {deadline:nc.date, dueTime:nc.start, course, note:`時間割の「${course}」から、次の授業 ${when} が始まる前までを締切にしました`};
}
/* 読み取った行に授業を結びつけ、締切が書かれていなければ次の授業から決める */
function withCourse(row){
  const course = row.course && courseNames().includes(row.course) ? row.course : matchCourse(row.title);
  if (!course) return {...row, course:null, dueTime:null};
  if (!row.deadline){ const cd = courseDue(course); if (cd) return {...row, cat:'study', deadline:cd.deadline, dueTime:cd.dueTime, course, note:cd.note}; }
  return {...row, cat:'study', course, dueTime:null};
}
/* ---------- シフト（日付で入れるバイト） ---------- */
const shiftsOn = date => (S.shifts || []).filter(x => x.date === date).sort((a, b) => toMin(a.start) - toMin(b.start));
function shiftPresets(){
  const cnt = {};
  for (const x of S.shifts || []){ const k = `${x.start}-${x.end}`; cnt[k] = (cnt[k] || 0) + 1; }
  const ks = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 3);
  return ks.length ? ks : ['18:00-22:00', '10:00-15:00'];
}
/* その日の授業・毎週の予定・ほかのシフトのうち、指定の時間と重なるもの */
function busyLabelsOn(date, s, e, skipId){
  const wd = parseYmd(date).getDay(), out = [];
  if (wd >= 1 && wd <= 6) S.periods.forEach((p, i) => { const n = S.timetable[`${wd}-${i + 1}`]; if (n && toMin(p[0]) < e && toMin(p[1]) > s) out.push(`${n}（${p[0]}〜${p[1]}）`); });
  S.jobs.filter(j => j.wd === wd).forEach(j => { if (toMin(j.start) < e && toMin(j.end) > s) out.push(`${j.label || JOB_KIND[jobKind(j)]}（${j.start}〜${j.end}）`); });
  shiftsOn(date).forEach(x => { if (x.id !== skipId && toMin(x.start) < e && toMin(x.end) > s) out.push(`${x.place}のシフト（${x.start}〜${x.end}）`); });
  return out;
}
function keepShiftInputs(){
  const sh = UI.sheet; if (!sh || (sh.type !== 'shift')) return;
  const ps = formEl.querySelector('#sh-ps'), pe = formEl.querySelector('#sh-pe'), np = formEl.querySelector('#sh-newplace');
  if (ps && ps.value) sh.ps = ps.value;
  if (pe && pe.value) sh.pe = pe.value;
  if (np) sh.newPlace = np.value;
  for (const d of sh.sel){
    const a = formEl.querySelector(`[name="ts-${d}"]`), b = formEl.querySelector(`[name="te-${d}"]`);
    if (a && b) sh.times[d] = [a.value || sh.ps, b.value || sh.pe];
  }
}
function openShiftSheet(){
  const thisMon = mondayOf(todayStr()), shown = addDays(thisMon, 7 * (UI.weekOff || 0));
  const [ps, pe] = shiftPresets()[0].split('-');
  const places = S.places || [];
  openSheet({type:'shift', from:shown > thisMon ? shown : thisMon, sel:[], times:{}, edited:{}, ps, pe, place:places[0] || '', adding:!places.length, newPlace:''});
}
/* ---------- 毎週の予定の種類（バイト／サークル／その他） ---------- */
const JOB_KIND = {job:'バイト', cir:'サークル', etc:'その他'};
const jobKind = j => JOB_KIND[j.kind] ? j.kind : (/サークル|部活/.test(j.label || '') ? 'cir' : (!j.label || /バイト/.test(j.label)) ? 'job' : 'etc');
/* ---------- 毎週の課題：授業が終わったら、次の授業までの課題を自動で入れる ---------- */
function courseSlots(course){
  const out = [];
  for (const [k, v] of Object.entries(S.timetable)){
    if (v !== course) continue;
    const [wd, p] = k.split('-').map(Number), per = S.periods[p - 1];
    if (!per || wd < 1 || wd > 6) continue;
    out.push({wd, period:p, start:per[0], end:per[1]});
  }
  return out.sort((a, b) => a.wd - b.wd || a.period - b.period);
}
// 「週1回」にしたときは、その週の最初のコマだけを数える
const weeklySlots = w => { const s = courseSlots(w.course); return w.per === 'week' ? s.slice(0, 1) : s; };
function lastEndedClass(w, today, now){
  const slots = weeklySlots(w);
  for (let i = 0; i <= 7 && slots.length; i++){
    const ds = addDays(today, -i), wd = parseYmd(ds).getDay();
    const c = slots.filter(x => x.wd === wd && (i > 0 || toMin(x.end) <= now)).sort((a, b) => b.period - a.period)[0];
    if (c) return {date:ds, period:c.period, end:c.end, key:`${ds}#${c.period}`};
  }
  return null;
}
function nextWeeklyClass(w){
  const slots = weeklySlots(w), today = todayStr(), now = nowMin();
  for (let i = 0; i <= 14 && slots.length; i++){
    const ds = addDays(today, i), wd = parseYmd(ds).getDay();
    const c = slots.filter(x => x.wd === wd && (i > 0 || toMin(x.end) > now)).sort((a, b) => a.period - b.period)[0];
    if (c) return {date:ds, period:c.period, end:c.end};
  }
  return null;
}
function weeklyDue(w, occ){
  let nc = null;
  if (w.per === 'week'){
    const s = weeklySlots(w)[0];
    for (let i = 1; s && i <= 14 && !nc; i++){ const ds = addDays(occ.date, i); if (parseYmd(ds).getDay() === s.wd) nc = {date:ds, start:s.start}; }
  } else nc = nextClass(w.course, occ.date, toMin(occ.end));
  if (!nc) return null;
  if (S.settings.courseDue === 'daybefore' && addDays(nc.date, -1) > occ.date) return {deadline:addDays(nc.date, -1), dueTime:null, next:nc};
  return {deadline:nc.date, dueTime:nc.start, next:nc};
}
function runWeekly(){
  const today = todayStr(), now = nowMin(), made = [];
  let changed = false;
  for (const w of S.weekly || []){
    if (!w.on || !courseNames().includes(w.course)) continue;
    const occ = lastEndedClass(w, today, now);
    if (!occ || w.lastKey === occ.key) continue;
    w.lastKey = occ.key; changed = true;
    if (S.tasks.some(t => t.weekly === w.id && t.occ === occ.key)) continue;
    const due = weeklyDue(w, occ); if (!due) continue;
    // 授業中などで、締切がもう過ぎているときは入れない
    if (due.deadline < today || (due.deadline === today && due.dueTime && toMin(due.dueTime) <= now)) continue;
    // 同じ授業で同じころが締切のやることを自分で入れてあれば、それを今回の分として扱う
    const same = S.tasks.find(t => !t.done && !t.weekly && t.course === w.course && t.deadline && t.deadline <= due.next.date && t.deadline >= addDays(due.next.date, -1));
    if (same){ same.weekly = w.id; same.occ = occ.key; continue; }
    const d = parseYmd(occ.date);
    const t = makeTask({title:`${w.title}（${d.getMonth()+1}/${d.getDate()}の回）`, cat:'study', deadline:due.deadline, dueTime:due.dueTime, course:w.course, min:w.min, imp:w.imp});
    t.weekly = w.id; t.occ = occ.key;
    S.tasks.push(t); made.push(t);
  }
  return {made, changed};
}
function weeklyStatus(w){
  if (!courseNames().includes(w.course)) return '時間割にこの授業がありません';
  if (!w.on) return 'お休み中（自動では追加しません）';
  const o = nextWeeklyClass(w); if (!o) return '';
  const due = weeklyDue(w, o);
  return `次は${md(o.date)} ${o.end}に追加${due ? `（締切 ${md(due.deadline)}${due.dueTime ? ' ' + due.dueTime : ''}）` : ''}`;
}
function toastWeekly(made){
  if (!made.length) return;
  toast(made.length === 1 ? `毎週の課題「${made[0].title}」を追加しました（締切 ${dueText(made[0])}）` : `毎週の課題を${made.length}件追加しました`);
}
function checkWeekly(){
  if (store.mode === 'loading') return false;
  const wk = runWeekly();
  if (wk.changed){ commit(); toastWeekly(wk.made); }
  return wk.changed;
}
const dueText = t => t.deadline ? `${md(t.deadline)}${t.dueTime ? ` ${t.dueTime}${t.course ? `（${t.course}の前）` : ''}` : ''}` : '締切なし';

/* ---------- 優先度の計算 ---------- */
const ratio = cat => clamp((S.learn[cat] || {r:1}).r || 1, 0.5, 2.5);
const effMin = t => round5(t.remaining * ratio(t.cat));

function taskScore(t, d){
  const urg = d === null ? 0.8 : d < 0 ? 12 : 10 / (d + 1);
  const pressure = d === null ? 0 : Math.min(6, 2 * (effMin(t) / 60) / (Math.max(d, 0) + 1));
  return (urg + pressure) * IMP[t.imp || 2];
}
function taskWhy(d, t){
  if (d === null) return '締切なし';
  if (d < 0) return `締切を${-d}日過ぎています`;
  if (d === 0) return t && t.dueTime ? `今日${t.dueTime}の授業まで` : '締切は今日';
  if (d === 1) return t && t.dueTime ? `あした${t.dueTime}の授業まで` : '締切はあした';
  return `あと${d}日`;
}
function routineDue(r, date){
  if (r.snooze && r.snooze > date) return null;
  if (r.type === 'weekly'){
    const wd = parseYmd(date).getDay();
    if (!(r.days || []).includes(wd) || r.last === date) return null;
    return {overdue:0, weekly:true};
  }
  if (!r.last) return {overdue:0};
  const since = daysBetween(r.last, date);
  const every = Math.max(1, Number(r.every) || 1);
  if (since < every) return null;
  return {overdue:since - every};
}
function routineScore(r, due){
  const base = due.weekly ? 9 : Math.min(12, 2.5 + 1.5 * due.overdue);
  return base * IMP[r.imp || 2];
}
/* 優先度の7段階（SS〜E）。スコアは締切までの日数・かかる時間・重要度から計算 */
const GRADES = [
  {g:'SS', min:12, desc:'今すぐ。締切を過ぎた、または今日が締切で時間がかかる'},
  {g:'S', min:8, desc:'今日中に。今日が締切、または今日の曜日の家事'},
  {g:'A', min:5, desc:'あしたまでに'},
  {g:'B', min:3, desc:'2〜3日のうちに'},
  {g:'C', min:1.8, desc:'今週のうちに'},
  {g:'D', min:1, desc:'余裕あり'},
  {g:'E', min:-Infinity, desc:'いつでもよい'}
];
const gradeOf = s => GRADES.find(x => s >= x.min).g;
const gradeTag = (s, big) => { const g = gradeOf(s); return `<span class="grade g-${g}${big ? ' big' : ''}" title="優先度 ${g}">${g}</span>`; };

function itemsFor(date){
  const items = [];
  for (const t of S.tasks){
    if (t.done || (t.snooze && t.snooze > date)) continue;
    const d = t.deadline ? daysBetween(date, t.deadline) : null;
    items.push({kind:'task', ref:t, id:t.id, title:t.title, cat:t.cat, min:effMin(t), score:taskScore(t, d), why:taskWhy(d, t)});
  }
  for (const r of S.routines){
    const due = routineDue(r, date);
    if (!due) continue;
    items.push({kind:'routine', ref:r, id:r.id, title:r.title, cat:'life', min:round5(r.est), score:routineScore(r, due),
      why: due.weekly ? '今日の家事' : due.overdue > 0 ? `${due.overdue}日おくれ` : '今日が目安の日'});
  }
  return items.sort((a, b) => b.score - a.score);
}

/* 学業と生活のバランスを取りながら、空き時間に詰める */
function buildPlan(date, isToday){
  const free = freeFor(date, isToday ? nowMin() : null);
  const freeTotal = sumFree(free);
  const mult = COND[condOf(date)].m;
  const cap = Math.floor(freeTotal * mult / 5) * 5;
  const items = itemsFor(date);
  const life = items.filter(i => i.cat === 'life'), work = items.filter(i => i.cat !== 'life');
  const lifeBudget = life.length ? Math.round(cap * (1 - S.settings.studyRatio)) : 0;
  const chosen = [], left = new Set(items.map(i => i.id));
  let used = 0, lifeUsed = 0;
  const take = (it, min, partial) => { chosen.push({...it, min, partial:!!partial}); used += min; if (it.cat === 'life') lifeUsed += min; left.delete(it.id); };

  // 1) 生活の枠（目安の配分ぶん）。今日やらないといけない家事は枠を超えても入れる
  for (const it of life){
    if (used + it.min > cap) continue;
    if (lifeUsed + it.min <= lifeBudget || it.score >= 9) take(it, it.min);
  }
  // 2) 学業・その他を優先度順に。入りきらない大きな課題は「一部だけ進める」
  for (const it of work){
    const rem = cap - used;
    if (rem < 15) break;
    if (it.min <= rem) take(it, it.min);
    else if (rem >= 30) take(it, Math.floor(rem / 5) * 5, true);
  }
  // 3) まだ時間が余れば残りの家事
  for (const it of life){
    if (left.has(it.id) && used + it.min <= cap) take(it, it.min);
  }
  // 時間帯に割り当てる（優先度の高いものから早い時間へ）
  chosen.sort((a, b) => b.score - a.score);
  const slots = free.map(f => ({s:f.s, e:f.e, cur:f.s}));
  for (const c of chosen){
    // 授業の前が締切の課題は、その授業の前（移動時間も引く）までに入れる
    const lim = c.kind === 'task' && c.ref.dueTime && c.ref.deadline === date ? toMin(c.ref.dueTime) - (Number(S.settings.buffer) || 0) : Infinity;
    const room = sl => Math.min(sl.e, lim) - sl.cur;
    let slot = slots.find(sl => room(sl) >= c.min);
    if (!slot && c.cat !== 'life'){
      const big = slots.reduce((a, b) => (!a || room(b) > room(a)) ? b : a, null);
      const r = big ? Math.floor(room(big) / 5) * 5 : 0;
      if (r >= 15){ c.min = r; c.partial = true; slot = big; }
    }
    if (slot){ c.s = slot.cur; c.e = slot.cur + c.min; slot.cur = c.e; c.placed = true; }
  }
  const plan = chosen.filter(c => c.placed).sort((a, b) => a.s - b.s);
  const inPlan = new Set(plan.map(p => p.id));
  const overflow = items.filter(i => !inPlan.has(i.id));
  return {free, freeTotal, cap, plan, overflow};
}

/* 締切までの空き時間（7割を使える前提）より作業が多ければ「間に合わないおそれ」 */
function riskSet(){
  const today = todayStr(), n0 = nowMin();
  const capCache = {};
  const dayCap = i => {
    if (capCache[i] != null) return capCache[i];
    const ds = addDays(today, i);
    const fr = sumFree(freeFor(ds, i === 0 ? n0 : null));
    return (capCache[i] = fr * (i === 0 ? COND[condOf(ds)].m : 0.7));
  };
  const ts = S.tasks.filter(t => !t.done && t.deadline).sort((a, b) => a.deadline.localeCompare(b.deadline));
  const risky = new Set(); let work = 0;
  for (const t of ts){
    const d = daysBetween(today, t.deadline);
    if (d < 0){ risky.add(t.id); continue; }
    work += effMin(t);
    let capSum = 0;
    for (let i = 0; i <= Math.min(30, d); i++){
      if (i === d && t.dueTime){
        const ds = addDays(today, i), lim = toMin(t.dueTime);
        const fr = freeFor(ds, i === 0 ? n0 : null).reduce((a, f) => a + Math.max(0, Math.min(f.e, lim) - f.s), 0);
        capSum += fr * (i === 0 ? COND[condOf(ds)].m : 0.7);
      } else capSum += dayCap(i);
    }
    if (work > capSum) risky.add(t.id);
  }
  return risky;
}
function alerts(){
  const today = todayStr(), risky = riskSet(), out = [];
  for (const t of S.tasks){
    if (t.done || !t.deadline) continue;
    const d = daysBetween(today, t.deadline);
    if (d < 0) out.push({lv:3, label:'要注意', html:`${esc(t.title)}｜締切を${-d}日過ぎてる`});
    else if (d === 0 && t.dueTime && nowMin() >= toMin(t.dueTime)) out.push({lv:3, label:'要注意', html:`${esc(t.title)}｜締切（今日${t.dueTime}）を過ぎてる`});
    else if (risky.has(t.id)) out.push({lv:3, label:'要注意', html:`${esc(t.title)}｜このままだと締切 ${esc(dueText(t))} に間に合わないかも`});
    else if (d <= 1) out.push({lv:2, label:'締切が近い', html:`${esc(t.title)}｜${d === 0 ? '今日' : 'あした'}${t.dueTime ? t.dueTime : ''}・${dur(effMin(t))}`});
  }
  for (const r of S.routines){
    const due = routineDue(r, today);
    if (due && due.overdue >= 2) out.push({lv:1, label:'たまっている', html:`${esc(r.title)}が${due.overdue}日おくれています`});
  }
  return out.sort((a, b) => b.lv - a.lv).slice(0, 3);
}

/* ---------- 記録と学習 ---------- */
function learn(cat, x){
  const L = S.learn[cat] || (S.learn[cat] = {r:1, n:0});
  L.r = +((L.r || 1) * 0.7 + clamp(x, 0.4, 2.5) * 0.3).toFixed(3);
  L.n = (L.n || 0) + 1;
}
/* ---------- やった記録（連続記録）。週に2日までは休んでも途切れない ---------- */
const REST_PER_WEEK = 2;
const mondayOf = d => addDays(d, -((parseYmd(d).getDay() + 6) % 7));
function streakInfo(){
  const today = todayStr(), days = S.doneDays || {};
  const active = d => (days[d] || 0) > 0;
  const keys = Object.keys(days).filter(active).sort();
  const todayDone = active(today);
  // 今週すでに休んだ日（月曜〜きのう、記録を始める前の日は数えない）
  const first = keys[0] || today;
  let restUsed = 0;
  for (let d = mondayOf(today); d < today; d = addDays(d, 1)) if (d >= first && !active(d)) restUsed++;
  const restLeft = Math.max(0, REST_PER_WEEK - restUsed);
  if (!keys.length) return {n:0, todayDone, restLeft, best:S.best || 0};
  let n = todayDone ? 1 : 0, misses = 0, wk = mondayOf(today);
  for (let d = addDays(today, -1); d >= first; d = addDays(d, -1)){
    const w = mondayOf(d); if (w !== wk){ wk = w; misses = 0; }
    if (active(d)) n++;
    else if (misses < REST_PER_WEEK) misses++;
    else break;
  }
  return {n, todayDone, restLeft, best:Math.max(S.best || 0, n)};
}
function recordDone(kind, id, act, how){
  const today = todayStr();
  UI.undo = JSON.stringify(S);
  act = clamp(Math.round(Number(act) || 0), 1, 600);
  const firstToday = !((S.doneDays || {})[today] > 0);
  let msg;
  if (kind === 'routine'){
    const r = S.routines.find(x => x.id === id); if (!r) return;
    r.last = today; r.snooze = null;
    r.est = round5(r.est * 0.6 + act * 0.4);
    S.log.push({d:today, title:r.title, cat:'life', act});
    msg = 'えらい。';
  } else {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    t.actual = (t.actual || 0) + act;
    if (how === 'finish'){
      learn(t.cat, act / Math.max(5, t.remaining));
      t.done = true; t.doneAt = today; t.remaining = 0;
      msg = 'えらい。';
    } else {
      t.remaining = Math.max(5, round5(t.remaining - act / ratio(t.cat)));
      t.snooze = null;
      msg = `記録した。残りは約${dur(effMin(t))}`;
    }
    S.log.push({d:today, title:t.title, cat:t.cat, act});
  }
  S.doneDays[today] = (S.doneDays[today] || 0) + 1;
  const st = streakInfo();
  S.best = Math.max(S.best || 0, st.n);
  if (firstToday) msg = st.n >= 2 ? `今日の1つ目。やった記録 ${st.n}日目。` : '今日の1つ目。記録スタート。';
  // 今日の段取りの残りを、先輩がひとことで
  let face = 'happy';
  try {
    const left = buildPlan(today, true).plan.length;
    if (how !== 'finish' && kind !== 'routine') face = 'normal';
    else msg += left ? `あと${left}件。` : 'ぜんぶ終わり。おやすみ…';
    if (!left && how === 'finish') face = 'sleep';
  } catch (err) {}
  toast(msg, true, face);
  closeSheet(); commit();
}

/* ---------- 入力の読み取り ---------- */
const LIFE_RE = /洗濯|掃除|片付|買い物|買い出し|買う|ゴミ|ごみ|料理|自炊|作り置き|洗い物|皿|風呂|トイレ|布団|シーツ|振込|支払|払う|手続|役所|郵便|クリーニング|散髪|病院|歯医者|銀行|家賃|光熱費/;
const STUDY_RE = /レポート|課題|宿題|予習|復習|試験|テスト|小テスト|発表|ゼミ|論文|読書|単語|勉強|授業|講義|演習|レジュメ|判例|条文|提出|資格/;
function localParse(line){
  let s = String(line).trim(); if (!s) return null;
  const today = todayStr(); let min = null, deadline = '', imp = 2, m;
  if ((m = s.match(/(\d+(?:\.\d+)?)\s*(?:時間|h)(?:\s*(\d+)\s*分)?/i))){ min = Math.round(parseFloat(m[1]) * 60) + (m[2] ? +m[2] : 0); s = s.replace(m[0], ' '); }
  else if ((m = s.match(/(\d+)\s*(?:分|min)/i))){ min = +m[1]; s = s.replace(m[0], ' '); }
  const rel = [['しあさって',3],['明明後日',3],['あさって',2],['明後日',2],['あした',1],['明日',1],['きょう',0],['今日',0]];
  for (const [w, n] of rel){ if (s.includes(w)){ deadline = addDays(today, n); s = s.replace(w, ' '); break; } }
  if (!deadline && (m = s.match(/(\d+)\s*日後/))){ deadline = addDays(today, +m[1]); s = s.replace(m[0], ' '); }
  if (!deadline && (m = s.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?/))){
    const y = new Date().getFullYear(); let dt = ymd(new Date(y, +m[1]-1, +m[2]));
    if (daysBetween(today, dt) < -30) dt = ymd(new Date(y+1, +m[1]-1, +m[2]));
    deadline = dt; s = s.replace(m[0], ' ');
  }
  if (!deadline && (m = s.match(/(来週|今週)?\s*([月火水木金土日])曜日?/))){
    const target = '日月火水木金土'.indexOf(m[2]), cur = parseYmd(today).getDay();
    if (m[1] === '来週'){ const toMon = ((8 - cur) % 7) || 7; deadline = addDays(today, toMon + ((target + 6) % 7)); }
    else deadline = addDays(today, (target - cur + 7) % 7);
    s = s.replace(m[0], ' ');
  }
  s = s.replace(/(までに|まで|締め?切り?|〆切?|提出期限)/g, ' ');
  if (/重要|大事|必修|絶対|単位/.test(s)) imp = 3;
  else if (/ついで|いつでも|ひまな?とき|暇/.test(s)) imp = 1;
  const cat = LIFE_RE.test(s) ? 'life' : STUDY_RE.test(s) ? 'study' : 'other';
  const title = s.replace(/\s+/g, ' ').trim() || String(line).trim();
  if (min == null) min = cat === 'life' ? 20 : 60;
  return withCourse({title:title.slice(0, 60), cat, deadline, min:clamp(round5(min), 5, 600), imp});
}
function normRow(o){
  if (!o || typeof o !== 'object') return null;
  const title = String(o.title ?? '').trim().slice(0, 60); if (!title) return null;
  const cat = ['study','life','other'].includes(o.cat) ? o.cat : 'study';
  const deadline = /^\d{4}-\d{2}-\d{2}$/.test(String(o.deadline)) ? String(o.deadline) : '';
  const min = clamp(round5(o.minutes ?? o.min ?? 30), 5, 600);
  const imp = clamp(Math.round(Number(o.importance ?? o.imp ?? 2)) || 2, 1, 3);
  const course = typeof o.course === 'string' ? o.course : null;
  return withCourse({title, cat, deadline, min, imp, course});
}
async function aiParse(q, signal){

今日は ${today}（${WD[parseYmd(today).getDay()]}曜日）です。

ルール:

時間割の授業: ${courseNames().join('、') || '（なし）'}

次の形のJSON配列だけを返してください:

入力:

const makeTask = r => ({id:newId(), title:r.title, cat:r.cat, deadline:r.deadline || null, dueTime:r.dueTime || null, course:r.course || null, est:r.min, remaining:r.min, imp:r.imp, done:false, created:todayStr()});

/* ---------- サンプル ---------- */
function loadSample(){
  const t = todayStr();
  const mk = (title, cat, d, min, imp) => ({id:newId(), title, cat, deadline: d === null ? null : addDays(t, d), est:min, remaining:min, imp, done:false, created:t});

}

/* 朝の「3秒チェック」：ナマケ先輩が、今日やる量をひとことで言う */
function senpaiCard(P, date, isToday, total){
  const h = new Date().getHours(), cond = condOf(date);
  const doneToday = (S.doneDays || {})[todayStr()] || 0;
  let face = 'normal', greet, line;
  if (isToday){
    greet = h < 4 ? 'まだ起きてるの？' : h < 11 ? 'おはよ。' : h < 17 ? 'おつかれ。' : 'こんばんは。';
    if (P.plan.length && !P.overflow.length) line = `今日は <b>${P.plan.length}件・${dur(total)}</b>。<br>空き時間に<b class="ok">収まる</b>から、さっさと終わらせて昼寝しよ。`;
    else if (P.plan.length){ line = `時間が足りないから、<b>${P.plan.length}件</b>に<b class="ng">しぼった</b>。<br>残り${P.overflow.length}件は、あしたでいいよ。`; }
    else if (P.overflow.length || P.freeTotal < 15) line = '今日はもう空き時間がないね。<br>あしたの段取りだけ見とこ。';
    else if (doneToday){ face = 'sleep'; greet = 'おつかれ。'; line = '今日のぶんは<b>ぜんぶ終わり</b>。<br>えらい。じゃ、おやすみ。'; }
    else { face = 'sleep'; line = '今日はゆったりの日。<br>休むのも段取りのうち。'; }
  } else {
    greet = 'あしたの話。';
    line = P.plan.length ? `あしたは <b>${P.plan.length}件・${dur(total)}</b>。${P.overflow.length ? `<br>入りきらない${P.overflow.length}件は、あさって以降に回すね。` : '<br>先に見ておくと、気がラク。'}` : 'あしたは、やることなし。<br>…最高。';
    if (!P.plan.length) face = 'sleep';
  }
  const st = streakInfo();
  const sline = st.n === 0 ? '1つ終わらせるとスタート' : st.todayDone ? `今日も進めた。ベストは${st.best}日` : `今日1つ終わらせると${st.n + 1}日目`;
  return `<section class="morning" aria-label="${isToday ? '今日のまとめ' : 'あしたのまとめ'}">
    <div class="sq-row"><div class="sq">${senpai(face, 'card')}</div><div class="bubble"><p class="greet">${greet}</p><p class="mline">${line}</p></div></div>
    <div class="cond"><span>${isToday ? '今日' : 'あした'}の調子</span><div class="seg" role="group" aria-label="コンディション">${Object.keys(COND).map(k => segBtn('cond', k, COND[k].label, k === cond, `data-date="${date}"`)).join('')}</div></div>
    ${isToday ? `<div class="streak">
      <div class="snum"><b>${st.n}</b><span>日</span></div>
      <div class="stext"><span class="slabel">やった記録</span><span>${sline}</span></div>
    </div>` : ''}
  </section>`;
}
function todayView(){

    ${P.plan.length ? `<div class="plan">${(S.settings.showTimes ? P.plan : P.plan.slice().sort((a, b) => b.score - a.score)).map((p, i) => planItem(p, isToday, i)).join('')}</div>` : emptyPlan(P, isToday)}
  </section>

  ${isToday ? doneToday(today) : ''}`;
}
function planItem(p, isToday, idx){
  const tags = [gradeTag(p.score), `<span class="tag ${p.cat}">${p.kind === 'routine' ? '家事' : CAT[p.cat]}</span>`, `<span class="tag ${p.score >= 8 ? 'hot' : 'plain'}">${esc(p.why)}</span>`];
  if (p.partial) tags.push(`<span class="tag plain">一部だけ進める</span>`);
  const times = S.settings.showTimes;
  const first = !times && idx === 0;
  const left = times
    ? `<div class="time"><span>${clock(p.s)}</span><span>${clock(p.e)}</span></div>`
    : `<div class="ord${first ? ' first' : ''}"><span class="sr">${idx + 1}番目</span><span aria-hidden="true">${idx + 1}</span></div>`;
  return `<article class="item${times ? '' : ' ordered'}${first ? ' is-next' : ''}">
    ${left}
    <div class="body">${first ? `<div class="nextlabel">${isToday ? '次はこれ' : 'あしたの最初はこれ'}</div>` : ''}<div class="title">${esc(p.title)}</div>
      <div class="meta">${tags.join('')}<span class="num">${dur(p.min)}</span>${isToday ? `<button type="button" class="link" data-act="later" data-kind="${p.kind}" data-id="${p.id}">後回し</button>` : ''}</div>
    </div>
    ${isToday ? `<button type="button" class="check ${p.cat}" data-act="done" data-kind="${p.kind}" data-id="${p.id}" data-min="${p.min}" aria-label="${esc(p.title)}を記録する"></button>` : gradeTag(p.score, true)}
  </article>`;
}
function emptyPlan(P, isToday){
  if (isToday && ((S.doneDays || {})[todayStr()] || 0) > 0 && !P.overflow.length) return `<div class="empty"><span>今日の段取りは、ぜんぶ終わり。</span><button type="button" class="btn small" data-act="day" data-v="tomorrow">あしたの段取りを見る</button></div>`;
  if (P.freeTotal < 15) return `<div class="empty"><span>${isToday ? '今日はもう空き時間がありません。' : 'あしたは空き時間がありません。'}</span>${isToday ? '<button type="button" class="btn small" data-act="day" data-v="tomorrow">あしたの段取りを見る</button>' : ''}</div>`;
  if (!S.tasks.some(t => !t.done) && !S.routines.length) return `<div class="empty">やることがまだありません。上の欄に「レポート あした 60分」のように書くと追加できます。</div>`;
  return `<div class="empty">空き時間に入る作業はありません。のんびりしましょう。</div>`;
}
function doneToday(today){
  const l = S.log.filter(x => x.d === today);
  if (!l.length) return '';
  const total = l.reduce((a, x) => a + (x.act || 0), 0);
  return `<details class="done"><summary>今日終わったこと（${l.length}件・${dur(total)}）</summary>${l.map(x => `<div class="drow"><span>${esc(x.title)}</span><span class="num">${dur(x.act)}</span></div>`).join('')}</details>`;
}
function adder(){

function buildIcs(list, morning){
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dandori//Prototype//JA', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:ダンドリの締切'];

    L.push('BEGIN:VEVENT', `UID:${t.id}-${d}@dandori`, `DTSTAMP:${stamp}`);
    let alarms;

    const m = toMin(S.settings.morningTime || '07:30'), today = todayStr();
    const start = nowMin() < m ? today : addDays(today, 1), title = icsEsc('今日の段取りを見る（ダンドリ）');
    L.push('BEGIN:VEVENT', 'UID:morning-check@dandori', `DTSTAMP:${stamp}`, `DTSTART:${ymdC(start)}T${hm(m)}`, `DTEND:${ymdC(start)}T${hm(Math.min(m + 5, 23*60 + 59))}`, 'RRULE:FREQ=DAILY',

async function makeCode(){

function zipOne(name, data){

function renderSheet(){

function readTask(fd, i){
  const title = String(fd.get(`title-${i}`) || '').trim().slice(0, 60);
  if (!title) return null;
  const dl = String(fd.get(`deadline-${i}`) || '');
  const deadline = /^\d{4}-\d{2}-\d{2}$/.test(dl) ? dl : '';
  // 時間割から決めた締切の「授業の開始時刻」は、日付を手で変えなかったときだけ引き継ぐ
  const meta = ((UI.sheet && (UI.sheet.meta || UI.sheet.rows)) || [])[i] || {};
  return {title, cat:['study','life','other'].includes(fd.get(`cat-${i}`)) ? fd.get(`cat-${i}`) : 'study',
    deadline, dueTime:meta.dueTime && deadline && deadline === meta.deadline ? meta.dueTime : null,
    course:meta.course || matchCourse(title) || null,
    min:clamp(round5(fd.get(`min-${i}`)), 5, 600), imp:clamp(Number(fd.get(`imp-${i}`)) || 2, 1, 3)};
}
