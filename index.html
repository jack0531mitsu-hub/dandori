async function sheetSubmit(submitter){
  const sh = UI.sheet; if (!sh) return;
  const fd = new FormData(formEl);
  const how = submitter && submitter.value;
  switch (sh.type){
    case 'confirm': {
      const add = [];
      sh.rows.forEach((_, i) => { if (sh.rows.length > 1 && !fd.get(`use-${i}`)) return; const r = readTask(fd, i); if (r) add.push(makeTask(r)); });
      if (!add.length){ toast('追加するやることがありません'); return; }
      S.tasks.push(...add);
      closeSheet(); commit(); toast(add.length > 1 ? `${add.length}件追加しました` : `「${add[0].title}」を追加しました`);
      return;
    }
    case 'task': {
      let r = readTask(fd, 0); if (!r){ toast('やることの名前を入れてください'); return; }
      if (!sh.id && !r.deadline) r = withCourse(r);
      if (sh.id){
        const t = S.tasks.find(x => x.id === sh.id); if (!t) return;
        Object.assign(t, {title:r.title, cat:r.cat, deadline:r.deadline || null, dueTime:r.dueTime || null, course:r.course || null, remaining:r.min, imp:r.imp});
        if (!t.actual) t.est = r.min;
      } else S.tasks.push(makeTask(r));
      closeSheet(); commit(); return;
    }
    case 'done': recordDone(sh.kind, sh.id, fd.get('act'), how === 'part' ? 'part' : 'finish'); return;
    case 'routine': {
      const title = String(fd.get('r-title') || '').trim().slice(0, 40);
      if (!title){ toast('家事の名前を入れてください'); return; }
      const type = fd.get('r-type') === 'weekly' ? 'weekly' : 'interval';
      const days = fd.getAll('r-day').map(Number);
      if (type === 'weekly' && !days.length){ toast('曜日を1つ以上選んでください'); return; }
      const last = String(fd.get('r-last') || '');
      const v = {title, type, days, every:clamp(Math.round(Number(fd.get('r-every')) || 7), 1, 60), est:clamp(round5(fd.get('r-est')), 5, 300), imp:clamp(Number(fd.get('r-imp')) || 2, 1, 3), last:/^\d{4}-\d{2}-\d{2}$/.test(last) ? last : null};
      if (sh.id){ const r = S.routines.find(x => x.id === sh.id); if (r) Object.assign(r, v); }
      else S.routines.push({id:newId(), ...v});
      closeSheet(); commit(); toast(`「${title}」を登録しました`); return;
    }
    case 'cell': {
      const name = String(fd.get('cname') || '').trim().slice(0, 30);
      if (how === 'clear' || !name) delete S.timetable[sh.k]; else S.timetable[sh.k] = name;
      closeSheet(); commit(); return;
    }
    case 'job': {
      const start = String(fd.get('j-start') || ''), end = String(fd.get('j-end') || '');
      if (!start || !end || toMin(end) <= toMin(start)){ toast('終わりの時刻は、始まりより後にしてください'); return; }
      const kind = JOB_KIND[fd.get('j-kind')] ? fd.get('j-kind') : 'job';
      const v = {wd:Number(fd.get('j-wd')), start, end, kind, label:String(fd.get('j-label') || '').trim().slice(0, 30) || JOB_KIND[kind]};
      if (sh.id){ const j = S.jobs.find(x => x.id === sh.id); if (j) Object.assign(j, v); } else S.jobs.push({id:newId(), ...v});
      closeSheet(); commit(); return;
    }
    case 'periods': {
      const ps = sh.periods.map((p, i) => [String(fd.get(`ps-${i}`) || p[0]), String(fd.get(`pe-${i}`) || p[1])]);
      if (ps.some(p => toMin(p[1]) <= toMin(p[0]))){ toast('各時限の終わりは、始まりより後にしてください'); return; }
      S.periods = ps;
      for (const k of Object.keys(S.timetable)) if (Number(k.split('-')[1]) > ps.length) delete S.timetable[k];
      closeSheet(); commit(); return;
    }
    case 'shift': {
      keepShiftInputs();
      const places = S.places || [];
      const place = ((sh.adding || !places.length) ? String(sh.newPlace || '').trim() : sh.place).slice(0, 20) || 'バイト';
      const sel = sh.sel.slice().sort();
      if (!sel.length){ toast('入る日を選んでください'); return; }
      for (const d of sel){
        const t = sh.times[d] || [sh.ps, sh.pe];
        if (!t[0] || !t[1] || toMin(t[1]) <= toMin(t[0])){ toast(`${md(d)}：終わりの時刻は、始まりより後にしてください（日をまたぐときは 23:59 までで入れてください）`); return; }
      }
      UI.undo = JSON.stringify(S);
      for (const d of sel){ const t = sh.times[d] || [sh.ps, sh.pe]; S.shifts.push({id:newId(), date:d, start:t[0], end:t[1], place}); }
      S.places = [place, ...places.filter(x => x !== place)].slice(0, 6);
      closeSheet(); commit(); toast(`${place}のシフトを${sel.length}件入れました`, true);
      return;
    }
    case 'shift1': {
      const x = (S.shifts || []).find(z => z.id === sh.id); if (!x) return;
      const date = String(fd.get('s1-date') || ''), st = String(fd.get('s1-start') || ''), en = String(fd.get('s1-end') || '');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('日付を入れてください'); return; }
      if (!st || !en || toMin(en) <= toMin(st)){ toast('終わりの時刻は、始まりより後にしてください'); return; }
      const place = String(fd.get('s1-place') || '').trim().slice(0, 20) || 'バイト';
      Object.assign(x, {date, start:st, end:en, place});
      S.places = [place, ...(S.places || []).filter(p => p !== place)].slice(0, 6);
      closeSheet(); commit(); toast('シフトを直しました'); return;
    }
    case 'weekly': {
      const course = String(fd.get('wk-course') || '');
      if (!courseNames().includes(course)){ toast('授業を選んでください'); return; }
      const title = String(fd.get('wk-title') || '').trim().slice(0, 40) || `${course} 課題`;
      const v = {course, title, min:clamp(round5(fd.get('wk-min')), 5, 600), imp:clamp(Number(fd.get('wk-imp')) || 2, 1, 3), per:fd.get('wk-per') === 'week' ? 'week' : 'class', on:fd.get('wk-on') === 'on'};
      let w;
      if (sh.id){
        w = S.weekly.find(x => x.id === sh.id); if (!w) return;
        const moved = w.course !== v.course || w.per !== v.per;
        Object.assign(w, v);
        // 授業を変えたときは、すでに終わった回の分をさかのぼって入れない
        if (moved){ const o = lastEndedClass(w, todayStr(), nowMin()); w.lastKey = o ? o.key : null; }
      } else {
        w = {id:newId(), ...v, lastKey:null};
        S.weekly.push(w);
        const o = lastEndedClass(w, todayStr(), nowMin());
        if (sh.fromTask){
          const t = S.tasks.find(x => x.id === sh.fromTask);
          if (t){ t.weekly = w.id; t.occ = o ? o.key : null; t.course = course; }
          w.lastKey = o ? o.key : null;
        } else if (fd.get('wk-now') !== 'on') w.lastKey = o ? o.key : null;
      }
      const made = runWeekly().made;
      closeSheet(); commit();
      if (made.length) toastWeekly(made);
      else { const st = weeklyStatus(w); toast(`「${title}」を毎週の課題にしました${st && w.on ? '。' + st : ''}`); }
      return;
    }
    case 'settings': {
      const a = String(fd.get('s-start') || S.settings.dayStart), b = String(fd.get('s-end') || S.settings.dayEnd);
      if (toMin(b) <= toMin(a)){ toast('1日の終わりは、始まりより後にしてください'); return; }
      S.settings = {...S.settings, dayStart:a, dayEnd:b, buffer:clamp(Math.round(Number(fd.get('s-buf')) || 0), 0, 60), studyRatio:clamp(Number(fd.get('s-ratio')) / 100 || 0.75, 0.5, 0.9), courseDue:fd.get('s-cdue') === 'daybefore' ? 'daybefore' : 'before', showTimes:fd.get('s-times') === 'on'};
      closeSheet(); commit(); toast('設定を保存しました'); return;
    }
  }
}

/* ---------- 通知（トースト） ---------- */
function toast(msg, undo, face){
  toastEl.innerHTML = `${face ? `<span class="tface">${senpai(face, 'head')}</span>` : ''}<span class="tmsg">${esc(msg)}</span>${undo ? '<button type="button" class="link inv" data-act="undo">元に戻す</button>' : ''}`;
  toastEl.hidden = false;
  clearTimeout(UI.tt);
  UI.tt = setTimeout(() => { toastEl.hidden = true; }, undo ? 6000 : 3500);
}

    case 'tab':
      UI.view = b.dataset.v;

    case 'day': UI.day = b.dataset.v; render(); break;

      const list = b.dataset.kind === 'routine' ? S.routines : S.tasks;
      const x = list.find(y => y.id === b.dataset.id);

      break;
    }
    case 'done': case 'open-done': {
      const list = b.dataset.kind === 'routine' ? S.routines : S.tasks;
      const x = list.find(y => y.id === b.dataset.id); if (!x) break;
      const min = Number(b.dataset.min) || (b.dataset.kind === 'routine' ? round5(x.est) : effMin(x));
      openSheet({type:'done', kind:b.dataset.kind, id:x.id, title:x.title, min});
      break;
    }
    case 'adj': { const i = formEl.querySelector('#act'); if (i) i.value = clamp((Number(i.value) || 0) + Number(b.dataset.v), 1, 600); break; }
    case 'new-task': openSheet({type:'task'}); break;
    case 'help': openSheet({type:'help', k:b.dataset.k}); break;
    case 'edit-task': {
      const t = S.tasks.find(x => x.id === b.dataset.id);

      break;

    case 'auto-fill': {

      if (!cd){ toast(`「${course}」の次の授業が、時間割の2週間先までに見つかりません`); break; }
      if (di) di.value = cd.deadline;
      const meta = UI.sheet.meta || UI.sheet.rows || (UI.sheet.meta = []);
      meta[i] = {...(meta[i] || {}), deadline:cd.deadline, dueTime:cd.dueTime, course};
      if (note){ note.textContent = cd.note; note.hidden = false; }
      const study = formEl.querySelector(`input[name="cat-${i}"][value="study"]`); if (study) study.checked = true;
      break;
    }
    case 'auto-due': {
      const t = S.tasks.find(x => x.id === b.dataset.id); if (!t) break;
      const course = t.course || matchCourse(t.title), cd = course ? courseDue(course) : null;
      if (!cd){ toast('次の授業が時間割に見つかりません'); break; }
      UI.undo = JSON.stringify(S);
      Object.assign(t, {deadline:cd.deadline, dueTime:cd.dueTime, course, cat:'study'});
      commit(); toast(cd.note, true); break;
    }
    case 'preset': openSheet({type:'routine', preset:{...PRESETS[Number(b.dataset.i)]}}); break;
    case 'new-routine': openSheet({type:'routine'}); break;
    case 'edit-routine': openSheet({type:'routine', id:b.dataset.id}); break;
    case 'cell': openSheet({type:'cell', k:b.dataset.k}); break;
    case 'new-job': openSheet({type:'job'}); break;
    case 'edit-job': openSheet({type:'job', id:b.dataset.id}); break;
    case 'periods': openSheet({type:'periods', periods:S.periods.map(p => p.slice())}); break;
    case 'settings': openSheet({type:'settings'}); break;
    case 'close': closeSheet(); break;
    case 'stop-ai': if (UI.ctl){ try { UI.ctl.abort(); } catch (err) {} } break;
    case 'load-sample': loadSample(); toast('サンプルを入れました。上の帯から、いつでも消せます'); break;
    case 'clear-sample': S = defaults(); UI.view = 'week'; commit(); toast('サンプルを消しました。まず時間割を入れましょう'); break;
    case 'del': {
      if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'もう一度押すと削除'; break; }
      UI.undo = JSON.stringify(S);
      const what = b.dataset.what, id = b.dataset.id;
      if (what === 'task') S.tasks = S.tasks.filter(x => x.id !== id);
      if (what === 'routine') S.routines = S.routines.filter(x => x.id !== id);
      if (what === 'job') S.jobs = S.jobs.filter(x => x.id !== id);
      if (what === 'weekly'){ S.weekly = S.weekly.filter(x => x.id !== id); S.tasks.forEach(t => { if (t.weekly === id) delete t.weekly; }); }
      closeSheet(); commit(); toast('削除しました', true); break;
    }
    case 'reset-all': {
      if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'もう一度押すと、すべて消えます'; break; }
      UI.undo = JSON.stringify(S);
      S = defaults(); UI.view = 'today'; closeSheet(); commit(); toast('すべてのデータを消しました', true); break;
    }
    case 'ics': exportIcs(); break;
    case 'transfer': openSheet({type:'transfer'}); break;
    case 'tt-edit': UI.ttEdit = true; render(); break;
    case 'tt-done': UI.ttEdit = false; render(); toast('変更は保存されています'); break;
    case 'tt-info': showTtInfo(b); break;
    case 'tt-dl': showDlInfo(b); break;
    case 'tt-shift': showShiftInfo(b); break;
    case 'mcal': openMonthCal(b.dataset.d); break;
    case 'mcal-day': UI.sheet.sel = b.dataset.d; renderSheet(); break;
    case 'mcal-month': {
      const f = parseYmd(UI.sheet.month); f.setMonth(f.getMonth() + Number(b.dataset.v));
      UI.sheet.month = ymd(f).slice(0, 8) + '01';
      const t = todayStr(); UI.sheet.sel = t.slice(0, 7) === UI.sheet.month.slice(0, 7) ? t : UI.sheet.month;
      renderSheet(); break;
    }
    case 'mcal-today': UI.sheet.month = today.slice(0, 8) + '01'; UI.sheet.sel = today; renderSheet(); break;
    case 'mcal-week': {
      const d = b.dataset.d; closeSheet();
      UI.view = 'week'; UI.ttEdit = false;
      UI.weekOff = Math.round(daysBetween(mondayOf(today), mondayOf(d)) / 7);
      try { localStorage.setItem(LS_VIEW, 'week'); } catch (err) {}
      render(); window.scrollTo(0, 0); break;
    }
    case 'mcal-add': { const d = b.dataset.d; openSheet({type:'task', deadline:d}); break; }
    case 'shift-new': openShiftSheet(); break;
    case 'shift-edit': openSheet({type:'shift1', id:b.dataset.id}); break;
    case 'shift-del': {
      const x = (S.shifts || []).find(z => z.id === b.dataset.id); if (!x) break;
      UI.undo = JSON.stringify(S);
      S.shifts = S.shifts.filter(z => z.id !== x.id);
      hideTtInfo(); if (UI.sheet) closeSheet(); commit(); toast(`${md(x.date)}の${x.place}のシフトを消しました`, true); break;
    }
    case 'sh-place': { keepShiftInputs(); UI.sheet.place = b.dataset.v; UI.sheet.adding = false; renderSheet(); break; }
    case 'sh-place-add': { keepShiftInputs(); UI.sheet.adding = true; renderSheet(); const n = formEl.querySelector('#sh-newplace'); if (n) n.focus(); break; }
    case 'sh-day': {
      keepShiftInputs();
      const sh = UI.sheet, d = b.dataset.d;
      if (sh.sel.includes(d)){ sh.sel = sh.sel.filter(x => x !== d); delete sh.times[d]; delete sh.edited[d]; }
      else { sh.sel.push(d); sh.times[d] = [sh.ps, sh.pe]; }
      renderSheet(); break;
    }
    case 'sh-from': {
      keepShiftInputs();
      const sh = UI.sheet, thisMon = mondayOf(today), nf = addDays(sh.from, Number(b.dataset.v));
      sh.from = nf < thisMon ? thisMon : nf; renderSheet(); break;
    }
    case 'sh-preset': {
      keepShiftInputs();
      const sh = UI.sheet, [ps, pe] = b.dataset.v.split('-');
      sh.ps = ps; sh.pe = pe; sh.sel.forEach(d => { sh.times[d] = [ps, pe]; }); sh.edited = {};
      renderSheet(); break;
    }
    case 'sh-copy': {
      const sh = UI.sheet, prevFrom = addDays(sh.from, -7);
      const prev = (S.shifts || []).filter(x => x.date >= prevFrom && x.date < sh.from);
      UI.undo = JSON.stringify(S);
      let n = 0;
      for (const x of prev){
        const d = addDays(x.date, 7);
        if (d < today || S.shifts.some(z => z.date === d && z.start === x.start && z.place === x.place)) continue;
        S.shifts.push({id:newId(), date:d, start:x.start, end:x.end, place:x.place}); n++;
      }
      closeSheet(); commit(); toast(n ? `先週のシフトを${n}件コピーしました` : 'コピーできるシフトはありませんでした（もう入っているか、過ぎた日です）', n > 0); break;
    }
    case 'wk-prev': UI.weekOff = (UI.weekOff || 0) - 1; render(); break;
    case 'wk-next': UI.weekOff = (UI.weekOff || 0) + 1; render(); break;
    case 'wk-today': UI.weekOff = 0; render(); break;
    case 'weekly-new': openSheet({type:'weekly', course:b.dataset.course || null}); break;
    case 'weekly-edit': openSheet({type:'weekly', id:b.dataset.id}); break;
    case 'weekly-from-task': {
      const t = S.tasks.find(x => x.id === b.dataset.id); if (!t) break;
      const course = t.course && courseNames().includes(t.course) ? t.course : matchCourse(t.title);
      if (!course){ toast('時間割の授業が見つかりません'); break; }
      openSheet({type:'weekly', course, title:t.title.replace(/（\d+\/\d+の回）$/, ''), min:t.est || 60, imp:t.imp || 2, fromTask:t.id});
      break;
    }
    case 'tr-make': trMake().catch(err => { console.error(err); toast('コードを作れませんでした'); }); break;
    case 'tr-file': trFile().catch(err => { console.error(err); toast('保存できませんでした'); }); break;
    case 'tr-read': trRead().catch(err => { console.error(err); toast('コードを読み込めませんでした'); }); break;
    case 'tr-pick': { keepTrInput(); const f = formEl.querySelector('#tr-filein'); if (f) f.click(); break; }
    case 'tr-apply': trApply(); break;
    case 'nag-later': S.nagUntil = addDays(today, 7); commit(); toast('1週間後にまたお知らせします'); break;
    case 'inapp-hide': UI.inappHidden = true; render(); break;
    case 'a2hs-hide': UI.a2hsHidden = true; try { localStorage.setItem('dandori.a2hs', 'off'); } catch (err) {} render(); break;
    case 'undo':
      if (UI.undo){ const prev = merge(JSON.parse(UI.undo)); UI.undo = null; S = prev; commit(); toastEl.hidden = true; }
      break;
  }
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (store.mode === 'loading'){ toast('保存先を準備しています。少し待ってから操作してください'); return; }
  const job = e.target === formEl ? sheetSubmit(e.submitter) : e.target.dataset.form === 'quick' ? quickAdd(e.target) : null;
  Promise.resolve(job).catch(err => { console.error(err); toast('保存できませんでした。ページを開き直してから、もう一度試してください'); });
});
document.addEventListener('change', e => {
  if (e.target.id === 'ai-toggle') UI.ai = e.target.checked;
  if (UI.sheet && UI.sheet.type === 'shift' && e.target.closest('#sheet-form')){
    const sh = UI.sheet;
    if (e.target.id === 'sh-ps' || e.target.id === 'sh-pe'){
      const ps = formEl.querySelector('#sh-ps').value, pe = formEl.querySelector('#sh-pe').value;
      // 個別に直していない日だけ、まとめて時間を変える
      keepShiftInputs();
      sh.ps = ps || sh.ps; sh.pe = pe || sh.pe;
      sh.sel.forEach(d => { if (!sh.edited[d]) sh.times[d] = [sh.ps, sh.pe]; });
      renderSheet();
    } else if (/^t[se]-/.test(e.target.name || '')){
      keepShiftInputs(); sh.edited[e.target.name.slice(3)] = true; renderSheet();
    }
  }
  if (e.target.name === 'j-kind'){
    const li = formEl.querySelector('#j-label');
    if (li && (!li.value.trim() || Object.values(JOB_KIND).includes(li.value.trim()))) li.value = JOB_KIND[e.target.value] || '';
  }
  if (e.target.id === 'wk-course'){
    const ti = formEl.querySelector('#wk-title'), prev = e.target.dataset.prev || '';
    if (ti && (!ti.value.trim() || ti.value === `${prev} 課題`)) ti.value = `${e.target.value} 課題`;
    e.target.dataset.prev = e.target.value;
  }
  if (e.target.id === 'tr-filein' && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    if (file.size > 2e6){ toast('ファイルが大きすぎます。引き継ぎコードのファイルを選んでください'); return; }
    file.text().then(t => trRead(t)).catch(err => { console.error(err); toast('ファイルを読み込めませんでした'); });
  }
  if (e.target.id === 'm-on'){ S.settings.morningOn = e.target.checked; commit(); }
  if (e.target.id === 'm-time' && /^\d{2}:\d{2}$/.test(e.target.value)){ S.settings.morningTime = e.target.value; commit(); }
  if (e.target.id === 'pcount' && UI.sheet && UI.sheet.type === 'periods'){
    const fd = new FormData(formEl);
    const cur = UI.sheet.periods.map((p, i) => [String(fd.get(`ps-${i}`) || p[0]), String(fd.get(`pe-${i}`) || p[1])]);
    const n = Number(e.target.value), base = defaults().periods.concat(EXTRA_PERIODS);
    UI.sheet.periods = Array.from({length:n}, (_, i) => cur[i] || base[i] || ['20:00','21:30']);
    renderSheet();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 's-ratio'){ const o = document.getElementById('s-ratio-out'); if (o) o.textContent = e.target.value; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) closeSheet(); });
setInterval(() => { if (checkWeekly()) return; if (UI.sheet) return; if ((UI.view === 'today' && document.activeElement?.id !== 'quick-in') || (UI.view === 'week' && !UI.ttEdit && !document.getElementById('wk-pop'))) render(); }, 60000);

boot();
})();
</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
